</style></head><body><h1>KABUKAN</h1><div class="tabs"><div class="tab active" onclick="showTab('watch')">監視銘柄</div><div class="tab" onclick="showTab('hold')">保存株</div><div class="tab" onclick="showTab('dividend')">配当</div></div><div id="watch" class="section active"><div class="sw"><input id="inp" placeholder="銘柄名を入力" oninput="doSearch(this.value)"><div id="drop"></div></div><div id="cards"></div><div class="upd" id="upd"></div></div><div id="hold" class="section"><div id="hold-form"><input id="hname" placeholder="銘柄名"><input id="hcode" placeholder="銘柄コード (例: 7203)"><input id="hprice" placeholder="取得単価 (円)" type="number"><button onclick="addHold()">追加</button></div><div id="hcards"></div></div><div id="dividend" class="section"><div id="div-form"><input id="div-name" placeholder="銘柄名"><input id="div-code" placeholder="銘柄コード (例: 2914)"><input id="div-dividend" placeholder="年間配当金 (円)" type="number"><input id="div-price" placeholder="購入単価 (円)" type="number"><button onclick="addDividend()">追加</button></div><div id="dcards"></div></div><div class="modal" id="editModal"><div class="modal-box"><h3>取得単価を修正</h3><input type="number" id="editPrice" placeholder="新しい取得単価"><div class="modal-btns"><button class="btn-ok" onclick="saveEdit()">保存</button><button class="btn-cancel" onclick="closeEdit()">キャンセル</button></div></div></div><div class="modal" id="editDivModal"><div class="modal-box"><h3>配当情報を修正</h3><input type="number" id="editDivDividend" placeholder="年間配当金"><input type="number" id="editDivPrice" placeholder="購入単価"><div class="modal-btns"><button class="btn-ok" onclick="saveDivEdit()">保存</button><button class="btn-cancel" onclick="closeDivEdit()">キャンセル</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>const B='https://kabukan.onrender.com';let C=[],H=JSON.parse(localStorage.getItem('holds')||'[]'),D=JSON.parse(localStorage.getItem('dividends')||'[]'),editIdx=-1;function loadStocks(){C=JSON.parse(localStorage.getItem('stocks')||'[]');load()}function loadDividends(){D=JSON.parse(localStorage.getItem('dividends')||'[]');renderDividends()}function showTab(t){localStorage.setItem('activeTab',t);document.querySelectorAll('.tab').forEach((x,i)=>{x.classList.toggle('active',['watch','hold','dividend'][i]===t)});document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');if(t==='hold')renderHolds();if(t==='dividend')loadDividends();syncNav(t)}var CHF=window.innerWidth<=480?9:16;function syncNav(t){var m={watch:'bn-watch',hold:'bn-hold',dividend:'bn-dividend'};document.querySelectorAll('.bn').forEach(function(x){x.classList.remove('active')});var e=document.getElementById(m[t]);if(e)e.classList.add('active')}function openEdit(i){editIdx=i;document.getElementById('editPrice').value=H[i].price;document.getElementById('editModal').classList.add('show')}function closeEdit(){document.getElementById('editModal').classList.remove('show');editIdx=-1}function saveEdit(){const p=parseFloat(document.getElementById('editPrice').value);if(!isNaN(p)&&p>0){H[editIdx].price=p;localStorage.setItem('holds',JSON.stringify(H));renderHolds()}closeEdit()}let editDivIdx=-1;function openDivEdit(i){editDivIdx=i;document.getElementById('editDivDividend').value=D[i].annual_dividend;document.getElementById('editDivPrice').value=D[i].purchase_price;document.getElementById('editDivModal').classList.add('show')}function closeDivEdit(){document.getElementById('editDivModal').classList.remove('show');editDivIdx=-1}async function saveDivEdit(){const dividend=parseFloat(document.getElementById('editDivDividend').value);const price=parseFloat(document.getElementById('editDivPrice').value);if(!isNaN(dividend)&&!isNaN(price)&&editDivIdx>=0){D[editDivIdx].annual_dividend=dividend;D[editDivIdx].purchase_price=price;localStorage.setItem('dividends',JSON.stringify(D));renderDividends()}closeDivEdit()}async function doSearch(q){const d=document.getElementById('drop');if(q.length<1){d.innerHTML='';return}try{const r=await fetch(B+'/search?q='+encodeURIComponent(q));const j=await r.json();d.innerHTML=j.results.length?j.results.map(x=>'<div class="di" onmousedown="pick(\''+x.code+'\',\''+x.name+'\')">'+x.name+' ('+x.code+')</div>').join(''):'<div class="di" style="color:#95a5a6">見つかりません</div>'}catch(e){d.innerHTML='<div class="di" style="color:#e74c3c">未接続</div>'}}function pick(code,name){document.getElementById('drop').innerHTML='';document.getElementById('inp').value='';if(!C.find(x=>x.code==code)){C.push({code,name});localStorage.setItem('stocks',JSON.stringify(C));load()}}function del(code){C=C.filter(x=>x.code!=code);localStorage.setItem('stocks',JSON.stringify(C));load()}function kabutan(code){window.open('https://kabutan.jp/stock/?code='+code,'_blank')}function ir(code){window.open('https://www.nikkei.com/nkd/company/?scode='+code,'_blank')}function shinyo(code){window.open('https://nikkeiyosoku.com/stock/margin/'+code+'/','_blank')}function jclass(j){return j==='買い候補'?'jbuy':j==='警戒'?'jwarn':'jneutral'}function fclass(f){return f==='割安'?'jbuy':f==='割高'?'jwarn':'jneutral'}async function load(){const el=document.getElementById('cards');if(!C.length){el.innerHTML='<p style="color:#95a5a6;text-align:center;width:100%">銘柄を検索して追加してください</p>';return}try{const r=await fetch(B+'/quotes?codes='+C.map(x=>x.code).join(','));const j=await r.json();el.innerHTML=j.quotes.map(q=>{if(q.error)return'<div class="card"><div class="nm">'+q.code+'</div><div style="color:#e74c3c">エラー</div><button class="db" onclick="del(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button></div>';const up=q.change>=0;const s=up?'+':'';const dv=q.deviation!=null?(q.deviation>=0?'+':'')+q.deviation+'%':'--';return'<div class="card"><div class="badges"><span id="fund_'+q.code+'" class="jneutral">ファンダ:--</span></div><div class="cardtop"><div class="cardleft"><div class="nmrow"><span class="nm">'+(q.name||q.code)+'</span><span class="'+jclass(q.judgment)+'">'+q.judgment+'</span></div><div class="pr '+(up?'up':'dn')+'">'+q.price.toLocaleString()+'円</div><div class="'+(up?'up':'dn')+'">'+s+q.change+'円 ('+s+q.changePct+'%)</div><div class="vorow"><span class="volabel">出来高</span><span class="voval">'+q.volume.toLocaleString()+'</span></div><div class="vorow"><span class="volabel">乖離率</span><span class="voval">'+dv+'</span></div></div><div class="cardright"><canvas id="vol_'+q.code+'" height="150"></canvas></div></div><div class="links"><a class="lnk" onclick="kabutan(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>信用倍率</a><a class="lnk" onclick="shinyo(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><circle cx="12" cy="12" r="9"/><path d="M8 8l4 5 4-5M12 13v5M9 15h6M9 17.5h6"/></svg>買残・売残</a><a class="lnk" onclick="ir(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>日経IR</a><button class="db" onclick="del(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button></div></div>'}).join('');document.getElementById('upd').textContent='更新: '+new Date().toLocaleTimeString();j.quotes.forEach(async(q)=>{if(q.error)return;fetch(B+'/fair-value/'+q.code).then(r=>r.json()).then(fv=>{const badge=document.getElementById('fund_'+q.code);if(!badge||fv.error)return;badge.className=fv.rating==='優良'?'jbuy':fv.rating==='要注意'?'jwarn':'jneutral';badge.textContent=fv.rating}).catch(()=>{});const cv=document.getElementById('vol_'+q.code);if(!cv)return;try{const hr=await fetch(B+'/history/'+q.code);const hj=await hr.json();const ctx=cv.getContext('2d');const grad=ctx.createLinearGradient(0,0,0,cv.height||150);grad.addColorStop(0,'#C2DDFF');grad.addColorStop(0.10,'#8FC2FF');grad.addColorStop(0.35,'#66A6FF');grad.addColorStop(0.70,'#3B82F6');grad.addColorStop(1,'#2563EB');new Chart(cv,{type:'bar',data:{labels:hj.dates,datasets:[{data:hj.volumes,backgroundColor:grad,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:5,color:'#B3B3B3',font:{size:13},callback:function(v,i){const d=this.getLabelForValue(v);return d?d.substring(5).replace('-','/'):d}},grid:{display:false}},y:{ticks:{color:'#B3B3B3',font:{size:13},callback:v=>v>=1000000?(v/1000000)+'M':v},grid:{color:'rgba(255,255,255,0.08)'}}},animation:false}})}catch(e){}})}catch(e){document.getElementById('upd').textContent='未接続'}}function addHold(){const name=document.getElementById('hname').value.trim();const code=document.getElementById('hcode').value.trim().replace(/[！-～]/g,s=>String.fromCharCode(s.charCodeAt(0)-0xFEE0));const price=parseFloat(document.getElementById('hprice').value);if(!name||!code||!price)return;H.push({name,code,price});localStorage.setItem('holds',JSON.stringify(H));document.getElementById('hname').value='';document.getElementById('hcode').value='';document.getElementById('hprice').value='';renderHolds()}async function renderHolds(){const el=document.getElementById('hcards');if(!H.length){el.innerHTML='<p style="color:#95a5a6;text-align:center;width:100%">保存株を追加してください</p>';return}try{const r=await fetch(B+'/quotes?codes='+H.map(x=>x.code).join(','));const j=await r.json();const rows=await Promise.all(j.quotes.map(async(q,i)=>{const h=H[i];const cur=q.price||0;const pct=((cur-h.price)/h.price*100).toFixed(2);const up=cur>=h.price;const tgt=Math.round(h.price*1.25);const stp=Math.round(h.price*0.80);const action=cur>=tgt?'売り':cur<=stp?'買い':'保有';const actionClass=action==='売り'?'hb-sell':action==='買い'?'hb-buy':'hb-hold';const cid='chart_'+i;return'<div class="hcard"><div class="hhead"><div class="hname">'+h.name+'('+h.code+')</div><span class="hbadge '+actionClass+'">'+action+'</span></div><div class="hbody"><div class="hleft"><div class="hprice '+(up?'up':'dn')+'">'+cur.toLocaleString()+'円</div><div class="hpct '+(up?'up':'dn')+'">'+(up?'+':'')+pct+'%</div><div class="hrow">取得単価: '+h.price.toLocaleString()+'円</div><div class="hrow tp">利確目安: '+tgt.toLocaleString()+'円</div><div class="hrow sl">損切目安: '+stp.toLocaleString()+'円</div></div><div class="hright"><div class="gcap">株価推移（%）</div><div class="cwrap cw1"><canvas id="'+cid+'"></canvas></div><div class="gcap gc2">出来高</div><div class="cwrap cw2"><canvas id="vol_'+cid+'"></canvas></div></div></div><div class="hbtns"><button class="hedit" onclick="openEdit('+i+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>編集</button><button class="hdel" onclick="delHold('+i+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button></div></div>';}));el.innerHTML=rows.join('');j.quotes.forEach(async(q,i)=>{const h=H[i];const cid='chart_'+i;const cv=document.getElementById(cid);if(!cv)return;var upx=(q.price||0)>=h.price;try{const hr=await fetch(B+'/history/'+h.code);const hj=await hr.json();const labels=hj.dates;const data=hj.prices.map(p=>parseFloat(((p-h.price)/h.price*100).toFixed(2)));new Chart(cv,{type:'line',data:{labels,datasets:[{data,borderColor:upx?'#22C55E':'#EF4444',backgroundColor:'transparent',borderWidth:2,pointRadius:0,tension:0.25,fill:false}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false},tooltip:{enabled:false}},layout:{padding:{top:2,right:4}},scales:{x:{ticks:{maxTicksLimit:5,maxRotation:0,color:'#9CA3AF',font:{size:CHF},padding:3,callback:function(v){var d=this.getLabelForValue(v);return d?d.substring(5).replace('-','/'):d}},grid:{color:'rgba(255,255,255,0.10)',borderDash:[2,3],drawTicks:false},border:{display:false}},y:{ticks:{color:'#9CA3AF',font:{size:CHF},padding:3,callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.10)',borderDash:[2,3],drawTicks:false},border:{display:false}}},animation:false}});const vcv=document.getElementById('vol_'+cid);if(vcv){var vmax=Math.max.apply(null,(hj.volumes&&hj.volumes.length)?hj.volumes:[0]);var vstep=Math.max(1,Math.ceil(vmax/5/1000000))*1000000;new Chart(vcv,{type:'bar',data:{labels:hj.dates,datasets:[{data:hj.volumes,backgroundColor:'#4A90E2',borderRadius:1,barPercentage:0.6,categoryPercentage:0.96}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false},tooltip:{enabled:false}},layout:{padding:{top:2,right:4}},scales:{x:{ticks:{maxTicksLimit:5,maxRotation:0,color:'#9CA3AF',font:{size:CHF},padding:3,callback:function(v){var d=this.getLabelForValue(v);return d?d.substring(5).replace('-','/'):d}},grid:{display:false},border:{display:false}},y:{beginAtZero:true,max:vstep*5,ticks:{stepSize:vstep,autoSkip:false,color:'#9CA3AF',font:{size:CHF},padding:3,callback:v=>v>=1000000?(v/1000000)+'M':v},grid:{color:'rgba(255,255,255,0.10)',borderDash:[2,3],drawTicks:false},border:{display:false}}},animation:false}})}}catch(e){}})}catch(e){el.innerHTML='<p style="color:#e74c3c">エラー</p>'}}function delHold(i){H.splice(i,1);localStorage.setItem('holds',JSON.stringify(H));renderHolds()}async function addDividend(){const name=document.getElementById('div-name').value.trim();const code=document.getElementById('div-code').value.trim().replace(/[！-～]/g,s=>String.fromCharCode(s.charCodeAt(0)-0xFEE0));const dividend=parseFloat(document.getElementById('div-dividend').value);const price=parseFloat(document.getElementById('div-price').value);if(!name||!code||!dividend||!price)return;D.push({code,name,annual_dividend:dividend,purchase_price:price});localStorage.setItem('dividends',JSON.stringify(D));document.getElementById('div-name').value='';document.getElementById('div-code').value='';document.getElementById('div-dividend').value='';document.getElementById('div-price').value='';renderDividends()}function delDividend(code){D=D.filter(x=>x.code!=code);localStorage.setItem('dividends',JSON.stringify(D));renderDividends()}async function renderDividends(){const el=document.getElementById('dcards');if(!D.length){el.innerHTML='<p style="color:#95a5a6;text-align:center;width:100%">配当銘柄を追加してください</p>';return}try{const r=await fetch(B+'/quotes?codes='+D.map(x=>x.code).join(','));const j=await r.json();const rows=await Promise.all(j.quotes.map(async(q,i)=>{const d=D[i];const price=q.price||0;const currentYield=price>0?((d.annual_dividend/price)*100).toFixed(2):0;const purchaseYield=d.purchase_price>0?((d.annual_dividend/d.purchase_price)*100).toFixed(2):null;const cid='div_chart_'+i;return'<div class="dcard"><div class="nm">'+d.name+'('+d.code+')</div><div class="yield-display"><div class="yield-item"><div class="yield-label">現在利回り</div><div class="yield-value">'+currentYield+'%</div></div>'+(purchaseYield?'<div class="yield-item"><div class="yield-label">購入時利回り</div><div class="yield-value">'+purchaseYield+'%</div></div>':'')+'</div><div class="vo">現在株価: '+price.toLocaleString()+'円</div><div class="vo">購入単価: '+d.purchase_price.toLocaleString()+'円</div><div class="vo">年間配当金: '+d.annual_dividend+'円</div><canvas id="'+cid+'" height="150"></canvas><div style="display:flex;gap:4px;margin-top:8px"><button onclick="openDivEdit('+i+')" style="background:none;border:2px solid #27ae60;color:#27ae60;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px">編集</button><button class="db" onclick="delDividend(\''+q.code+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin-right:6px"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button></div></div>';}));el.innerHTML=rows.join('');j.quotes.forEach(async(q,i)=>{const d=D[i];const cid='div_chart_'+i;const cv=document.getElementById(cid);if(!cv)return;try{const dr=await fetch(B+'/dividend-yield/'+d.code);const dj=await dr.json();if(dj.error)return;const labels=dj.dates;const yields=dj.yields;new Chart(cv,{type:'line',data:{labels,datasets:[{label:'利回り',data:yields,borderColor:'#e74c3c',backgroundColor:'rgba(231,76,60,0.1)',borderWidth:2,pointRadius:0,tension:0.3},{label:'5%',data:Array(yields.length).fill(5),borderColor:'#bdc3c7',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false},{label:'5.5%',data:Array(yields.length).fill(5.5),borderColor:'#f39c12',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false},{label:'6%',data:Array(yields.length).fill(6),borderColor:'#e74c3c',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false},{label:'購入時利回り',data:Array(yields.length).fill(d.purchase_price>0?((d.annual_dividend/d.purchase_price)*100):null),borderColor:'#9b59b6',borderWidth:2,borderDash:[8,4],pointRadius:0,fill:false}]},options:{plugins:{legend:{display:true,labels:{color:'#7f8c8d',font:{size:10}}}},scales:{x:{ticks:{maxTicksLimit:5,color:'#7f8c8d'},grid:{color:'#ecf0f1'}},y:{ticks:{color:'#7f8c8d',callback:v=>v+'%'},grid:{color:'#ecf0f1'}}},animation:false}})}catch(e){}})}catch(e){el.innerHTML='<p style="color:#e74c3c">エラー</p>'}}loadStocks();const savedTab=localStorage.getItem('activeTab');if(savedTab && savedTab!=='watch'){showTab(savedTab);}</script></body></html>
