/* ========== 保存株ページ 画像準拠（新規実装） ========== */
body{padding-bottom:108px}
#hcards{gap:20px}
.hcard{background:#171717;background-image:none;border:1px solid rgba(212,175,55,0.18);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.35)}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hname{font-size:32px;font-weight:700;color:#FFFFFF;line-height:1.2;min-width:0}
.hbadge{height:34px;padding:0 16px;border-radius:999px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap;border:1px solid;flex:0 0 auto}
.hb-sell{background:rgba(34,197,94,0.14);color:#22C55E;border-color:#22C55E}
.hb-hold{background:rgba(212,175,55,0.14);color:#D4AF37;border-color:#D4AF37}
.hb-buy{background:rgba(239,68,68,0.14);color:#EF4444;border-color:#EF4444}
.hbody{display:flex;gap:20px;align-items:flex-start;margin-top:14px}
.hleft{flex:0 0 35%;max-width:35%;min-width:0}
.hright{flex:1 1 65%;min-width:0}
.hprice{font-size:56px;font-weight:700;line-height:1.02;letter-spacing:-1px}
.hpct{font-size:24px;font-weight:700;margin-top:6px}
.hrow{font-size:20px;font-weight:400;color:#B5B5B5;margin-top:16px;line-height:1.3}
.hrow.tp{color:#22C55E}
.hrow.sl{color:#EF4444}
.gcap{font-size:17px;color:#9CA3AF;margin:0 0 8px;font-weight:400}
.cwrap{position:relative;width:100%}
.cw1{height:180px}
.cw2{height:150px}
.hvol{margin-top:20px}
.hbtns{display:flex;gap:12px;margin-top:20px;align-items:center}
.hedit{flex:0 0 auto;width:76px;height:46px;background:transparent;border:1px solid #22C55E;color:#22C55E;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;padding:0}
.hdel{flex:1 1 auto;height:48px;background:transparent;background-image:none;border:1px solid #EF4444;color:#EF4444;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
/* 入力フォーム（厳守） */
#hold-form{background:#171717;background-image:none;border:1px solid rgba(212,175,55,0.18);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.35);margin:0 auto 20px}
#hold-form input{background:#1F1F1F;border:1px solid rgba(255,255,255,0.08);height:56px;border-radius:12px;font-size:20px;padding:0 20px;margin-bottom:16px;color:#FFFFFF}
#hold-form input::placeholder{color:#9CA3AF}
#hold-form button{height:56px;border-radius:12px;font-size:20px;margin-top:4px}
/* 下部ナビ */
.bnav{position:fixed;left:0;right:0;bottom:0;background:#0F0F0F;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:stretch;z-index:900;padding-bottom:env(safe-area-inset-bottom,0px)}

.bn svg{width:26px;height:26px}
.bn.active{color:#D4AF37}

</style></head><body><h1>KABUKAN</h1><div class="tabs"><div class="tab active" onclick="showTab('watch')">監視銘柄</div><div class="tab" onclick="showTab('hold')">保存株</div><div class="tab" onclick="showTab('dividend')">配当</div></div><div id="watch" class="section active"><div class="sw"><input id="inp" placeholder="銘柄名を入力" oninput="doSearch(this.value)"><div id="drop"></div></div><div id="cards"></div><div class="upd" id="upd"></div></div><div id="hold" class="section"><div id="hold-form"><input id="hname" placeholder="銘柄名"><input id="hcode" placeholder="銘柄コード (例: 7203)"><input id="hprice" placeholder="取得単価 (円)" type="number"><button onclick="addHold()">追加</button></div><div id="hcards"></div></div><div id="dividend" class="section"><div id="div-form"><input id="div-name" placeholder="銘柄名"><input id="div-code" placeholder="銘柄コード (例: 2914)"><input id="div-dividend" placeholder="年間配当金 (円)" type="number"><input id="div-price" placeholder="購入単価 (円)" type="number"><button onclick="addDividend()">追加</button></div><div id="dcards"></div></div><div class="modal" id="infoModal"><div class="modal-box info-box"><h3 id="infoTitle"></h3><div id="infoBody"></div><div class="modal-btns"><button class="btn-cancel" onclick="closeInfo()">閉じる</button></div></div></div><div class="modal" id="editModal"><div class="modal-box"><h3>取得単価を修正</h3><input type="number" id="editPrice" placeholder="新しい取得単価"><div class="modal-btns"><button class="btn-ok" onclick="saveEdit()">保存</button><button class="btn-cancel" onclick="closeEdit()">キャンセル</button></div></div></div><div class="modal" id="editDivModal"><div class="modal-box"><h3>配当情報を修正</h3><input type="number" id="editDivDividend" placeholder="年間配当金"><input type="number" id="editDivPrice" placeholder="購入単価"><div class="modal-btns"><button class="btn-ok" onclick="saveDivEdit()">保存</button><button class="btn-cancel" onclick="closeDivEdit()">キャンセル</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>const B='https://kabukan.onrender.com';var QMAP={},FVMAP={};let C=[],H=JSON.parse(localStorage.getItem('holds')||'[]'),D=JSON.parse(localStorage.getItem('dividends')||'[]'),editIdx=-1;function loadStocks(){C=JSON.parse(localStorage.getItem('stocks')||'[]');load()}function loadDividends(){D=JSON.parse(localStorage.getItem('dividends')||'[]');renderDividends()}function showTab(t){localStorage.setItem('activeTab',t);document.querySelectorAll('.tab').forEach((x,i)=>{x.classList.toggle('active',['watch','hold','dividend'][i]===t)});document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');if(t==='hold')renderHolds();if(t==='dividend')loadDividends();syncNav(t)}var CHF=window.innerWidth<=480?9:16;function syncNav(t){var m={watch:'bn-watch',hold:'bn-hold',dividend:'bn-dividend'};document.querySelectorAll('.bn').forEach(function(x){x.classList.remove('active')});var e=document.getElementById(m[t]);if(e)e.classList.add('active')}function closeInfo(){document.getElementById('infoModal').classList.remove('show')}
function openInfo(t,h){document.getElementById('infoTitle').textContent=t;document.getElementById('infoBody').innerHTML=h;document.getElementById('infoModal').classList.add('show')}

function openEdit(i){editIdx=i;document.getElementById('editPrice').value=H[i].price;document.getElementById('editModal').classList.add('show')}function closeEdit(){document.getElementById('editModal').classList.remove('show');editIdx=-1}function saveEdit(){const p=parseFloat(document.getElementById('editPrice').value);if(!isNaN(p)&&p>0){H[editIdx].price=p;localStorage.setItem('holds',JSON.stringify(H));renderHolds()}closeEdit()}let editDivIdx=-1;function openDivEdit(i){editDivIdx=i;document.getElementById('editDivDividend').value=D[i].annual_dividend;document.getElementById('editDivPrice').value=D[i].purchase_price;document.getElementById('editDivModal').classList.add('show')}function closeDivEdit(){document.getElementById('editDivModal').classList.remove('show');editDivIdx=-1}async function saveDivEdit(){const dividend=parseFloat(document.getElementById('editDivDividend').value);const price=parseFloat(document.getElementById('editDivPrice').value);if(!isNaN(dividend)&&!isNaN(price)&&editDivIdx>=0){D[editDivIdx].annual_dividend=dividend;D[editDivIdx].purchase_price=price;localStorage.setItem('dividends',JSON.stringify(D));renderDividends()}closeDivEdit()}async function doSearch(q){const d=document.getElementById('drop');if(q.length<1){d.innerHTML='';return}try{const r=await fetch(B+'/search?q='+encodeURIComponent(q));const j=await r.json();d.innerHTML=j.results.length?j.results.map(x=>'<div class="di" onmousedown="pick(\''+x.code+'\',\''+x.name+'\')">'+x.name+' ('+x.code+')</div>').join(''):'<div class="di" style="color:#95a5a6">見つかりません</div>'}catch(e){d.innerHTML='<div class="di" style="color:#e74c3c">未接続</div>'}}function pick(code,name){document.getElementById('drop').innerHTML='';document.getElementById('inp').value='';if(!C.find(x=>x.code==code)){C.push({code,name});localStorage.setItem('stocks',JSON.stringify(C));load()}}function del(code){C=C.filter(x=>x.code!=code);localStorage.setItem('stocks',JSON.stringify(C));load()}function kabutan(code){window.open('ht
